basePath: /api/v1
definitions:
  request.Login:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request.Register:
    properties:
      email:
        type: string
      password:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  response.AuthData:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/response.UserData'
    type: object
  response.RefreshTokenData:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.UserData:
    properties:
      createdAt:
        type: string
      displayName:
        type: string
      email:
        type: string
      id:
        type: string
      isAdmin:
        type: boolean
      phone:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
  utils.ResponseError:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  utils.ResponseSuccess:
    properties:
      message:
        type: string
      metadata: {}
      options: {}
      status:
        type: integer
    type: object
host: localhost:3030
info:
  contact: {}
  description: This is the API for NHBook, a book management system.
  title: NHBook API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: User login with username and password
      parameters:
      - description: User login details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseError'
            - properties:
                message:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: User login
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Handle refresh token to get new access token
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/response.RefreshTokenData'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseError'
            - properties:
                message:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Handle refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with username, email, password, and phone number
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/utils.ResponseError'
            - properties:
                message:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Register a new user
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-Api-Key
    type: apiKey
swagger: "2.0"
